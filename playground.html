<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGI Visual Body Language - Playground v4.0 (Autonomous VAD)</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --text-color: #c5c6c7;
            --primary-color: #66fcf1;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        #canvas-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20,24,35,1) 0%, rgba(11,12,16,1) 70%);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            border-radius: 50%;
        }

        .text-display {
            text-align: center;
            margin-bottom: 25px;
            min-height: 80px;
        }

        .user-state {
            font-size: 0.9rem;
            color: #8892b0;
            margin-bottom: 8px;
            transition: color 0.3s;
            letter-spacing: 0.5px;
        }

        .ai-state {
            font-size: 1.35rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255,255,255,0.1);
        }

        .control-panel {
            background: rgba(31, 40, 51, 0.4);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 252, 241, 0.1);
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            background: #1f2833;
            border: 1px solid #45f3ff33;
            color: var(--text-color);
            padding: 12px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
        }

        button.active {
            background: var(--primary-color);
            color: var(--bg-color);
            border-color: var(--primary-color);
        }

        .mic-box {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
        }

        .btn-mic {
            background: #1f2833;
            border: 1px solid #66fcf155;
            color: #66fcf1;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(102,252,241,0.1);
            transition: all 0.3s;
        }

        .sliders {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .slider-item {
            display: flex;
            flex-direction: column;
        }

        .slider-item label {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #8892b0;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: #1f2833;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .debug-panel {
            font-family: monospace;
            font-size: 0.8rem;
            color: #8892b0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="canvas-container">
        <canvas id="playgroundCanvas" width="400" height="400"></canvas>
    </div>

    <div class="text-display">
        <div class="user-state" id="userText">（用户正在说话） | (User Speaking...)</div>
        <div class="ai-state" id="aiText">正在聆听 | LISTENING</div>
    </div>

    <div class="control-panel">
        <div class="mic-box">
            <button id="btnMic" class="btn-mic" onclick="initAudio()">🎙️ 唤醒全自动具身 VAD 状态机 (Enable Fully Autonomous GNVE)</button>
        </div>

        <div class="button-group">
            <button id="btnListen" class="active" onclick="switchState('LISTENING')">1. 聆听(说话)</button>
            <button id="btnEval" onclick="touchStateWithCheck('EVALUATING')">2. 评估(停顿)</button>
            <button id="btnYield" onclick="switchState('YIELDING')">3. 让步(继续说)</button>
            <button id="btnRespond" onclick="switchState('RESPONDING')">4. 应答(答复)</button>
        </div>

        <div class="sliders">
            <div class="slider-item">
                <label>亲密度 (Intimacy) <span id="valIntimacy">0.5</span></label>
                <input type="range" id="slideIntimacy" min="0" max="1" step="0.05" value="0.5" oninput="updateSliders()">
            </div>
            <div class="slider-item">
                <label>紧急度 (Urgency) <span id="valUrgency">0.5</span></label>
                <input type="range" id="slideUrgency" min="0" max="1" step="0.05" value="0.5" oninput="updateSliders()">
            </div>
        </div>

        <div class="debug-panel">
            <div>阻尼感 (Damping): <span id="dbgDamping">0.00</span></div>
            <div>频率 (Freq): <span id="dbgFreq">0.00</span> Hz</div>
            <div>计时器 (Timer): <span id="dbgTimer">就绪</span></div>
            <div>谱半径 ρ(J): <span id="dbgJacobian">0.000</span></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('playgroundCanvas');
    const ctx = canvas.getContext('2d');

    let audioContext, analyser, dataArray;
    let micVolume = 0.0; 

    // 自制自适应全自动 VAD 核心控制参数
    const SILENCE_THRESHOLD = 0.035; // 判定为静音的归一化音量阈值
    const SPEAKING_THRESHOLD = 0.05; // 判定为重新开口说话的音量阈值
    let silenceDuration = 0.0;       // 静音累积时长（秒）
    let yieldingDuration = 0.0;      // 让步爆发状态状态停留计时器

    const STATES = {
        LISTENING: { user: '（用户正在说话） | (User Speaking...)', ai: '正在聆听 | LISTENING', color: {r: 30, g: 144, b: 255} }, 
        EVALUATING: { user: '（用户停顿中...） | (User Pausing...)', ai: '正在评估... | EVALUATING...', color: {r: 255, g: 190, b: 0} }, 
        YIELDING: { user: '（用户继续说话） | (User Continued Speaking...)', ai: '继续聆听 | RESUMING LISTENING', color: {r: 30, g: 144, b: 255} }, 
        RESPONDING: { user: '（AI应答中） | (AI Responding...)', ai: '好的，我明白了 | OK, I UNDERSTAND', color: {r: 0, g: 230, b: 118} } 
    };
    let currentState = 'LISTENING';
    let lastState = 'LISTENING';
    let evalTime = 0;
    let evalMaxDuration = 4.0;

    let phase = 0.0;
    let mass = 1.0;
    
    let x = 1.0;
    let targetX = 1.0;
    let vX = 0.0;

    let currentFreq = 0.5;
    let targetFreq = 0.5;
    let vFreq = 0.0;

    let currentRGB_norm = {r: 30/255, g: 144/255, b: 255/255};
    let vR = 0.0, vG = 0.0, vB = 0.0;
    let currentBreathAmp = 0.0;
    let currentRotSpeed = 0.008;
    let currentShrink = 0.0;

    const particles = [];
    const PARTICLE_COUNT = 80;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
            angle: Math.random() * Math.PI * 2,
            distance: Math.random() * 80 + 35, 
            size: Math.random() * 2 + 1,
            speedOffset: Math.random() * 0.4 + 0.8
        });
    }

    function initAudio() {
        if (audioContext) return;
        navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 64; 
            source.connect(analyser);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            const btnMic = document.getElementById('btnMic');
            btnMic.innerText = "🤖 自动 VAD 已激活 • 全语音无鼠标交互中";
            btnMic.style.background = "#00e676";
            btnMic.style.color = "#0b0c10";
            btnMic.style.borderColor = "#00e676";
            btnMic.style.boxShadow = "0 0 20px rgba(0,230,118,0.4)";
        }).catch(err => {
            console.error("无法访问麦克风:", err);
            alert("请允许麦克风权限以体验全自动 VAD 逻辑。");
        });
    }

    function switchState(stateName) {
        lastState = currentState;
        currentState = stateName;
        evalTime = 0; 
        yieldingDuration = 0.0; // 重置让步计时器

        clearTimeout(window.evalAutoTrigger);

        document.querySelectorAll('.button-group button').forEach(btn => btn.classList.remove('active'));
        if(stateName === 'LISTENING') document.getElementById('btnListen').classList.add('active');
        if(stateName === 'EVALUATING') document.getElementById('btnEval').classList.add('active');
        if(stateName === 'YIELDING') document.getElementById('btnYield').classList.add('active');
        if(stateName === 'RESPONDING') document.getElementById('btnRespond').classList.add('active');

        document.getElementById('userText').innerText = STATES[stateName].user;
        document.getElementById('aiText').innerText = STATES[stateName].ai;

        if (stateName === 'RESPONDING') {
            vX = 0.8;
            targetX = 1.0;
        } else if (stateName === 'YIELDING') {
            vX = 3.2;         
            targetX = 1.0;    
            phase = 0.0;      
        } else {
            targetX = 1.0;
        }

        if (stateName === 'EVALUATING') {
            window.evalAutoTrigger = setTimeout(() => {
                if (currentState === 'EVALUATING') {
                    switchState('RESPONDING');
                }
            }, evalMaxDuration * 1000); 
        }
    }

    function touchStateWithCheck(stateName) {
        if (stateName === 'EVALUATING') {
            phase = 0.0;
        }
        switchState(stateName);
    }

    function updateSliders() {
        const slideIntimacy = document.getElementById('slideIntimacy');
        const slideUrgency = document.getElementById('slideUrgency');
        if (slideIntimacy && slideUrgency) {
            document.getElementById('valIntimacy').innerText = slideIntimacy.value;
            document.getElementById('valUrgency').innerText = slideUrgency.value;
        }
    }

    function physicsLoop() {
        const slideIntimacy = document.getElementById('slideIntimacy');
        const slideUrgency = document.getElementById('slideUrgency');
        const intimacy = slideIntimacy ? parseFloat(slideIntimacy.value) : 0.5;
        const urgency = slideUrgency ? parseFloat(slideUrgency.value) : 0.5;
        
        let damping = 0.05 + intimacy * (1.0 - urgency) * 0.35;
        let stiffness = 0.05 + (urgency * 0.2) + (1.0 - damping) * 0.15;
        evalMaxDuration = 2.5 + intimacy * 3.5 - urgency * 1.5;
        if (evalMaxDuration < 1.5) evalMaxDuration = 1.5; 

        // -----------------------------------------------------------------------------------------
        // 🔮 全自动 VAD 边缘状态机决策层
        // -----------------------------------------------------------------------------------------
        if (analyser) {
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let targetVolume = sum / dataArray.length / 255.0;
            micVolume += (targetVolume - micVolume) * 0.25; 

            // 决策核心 1：如果在聆听状态，且说话声低于阈值，开始积累静音时长
            if (currentState === 'LISTENING') {
                if (micVolume < SILENCE_THRESHOLD) {
                    silenceDuration += 0.016; // 每次执行大约16毫秒
                    if (silenceDuration >= 0.65) { // 连续沉默超过 650 毫秒，自动转入评估
                        silenceDuration = 0.0;
                        switchState('EVALUATING');
                    }
                } else {
                    silenceDuration = 0.0; // 一旦有声音，静音计时立即归零
                }
            }

            // 决策核心 2：如果在黄色评估（倒计时倒数）中，用户突然再次开口抢词
            if (currentState === 'EVALUATING') {
                if (micVolume > SPEAKING_THRESHOLD) {
                    switchState('YIELDING'); // 触发炸开的让步动画！
                }
            }

            // 决策核心 3：如果在让步爆发状态，保持一定时间释放能量，随后自动回到聆听
            if (currentState === 'YIELDING') {
                yieldingDuration += 0.016;
                if (yieldingDuration >= 0.85) { // 维持 850 毫秒的能量倾泄后复位
                    yieldingDuration = 0.0;
                    switchState('LISTENING');
                }
            }
        } else {
            micVolume += (0.0 - micVolume) * 0.15;
        }

        let progress = 0.0;
        if (currentState === 'LISTENING') {
            targetFreq = 0.4 + micVolume * 0.6;
        } else if (currentState === 'YIELDING') {
            targetFreq = 0.3;
        } else if (currentState === 'EVALUATING') {
            evalTime += 0.016;
            progress = Math.min(evalTime / evalMaxDuration, 1.0);
            
            let baseFreq = 0.4 + Math.pow(progress, 1.4) * 2.8;
            let flutter = Math.sin(evalTime * 6.5) * 0.15 * (1.0 - progress); 
            targetFreq = baseFreq + flutter;
            if (targetFreq < 0.2) targetFreq = 0.2; 
        } else if (currentState === 'RESPONDING') {
            targetFreq = 0.0;
        }

        const SUBSTEPS = 4;
        const dt = 0.012; 

        for (let step = 0; step < SUBSTEPS; step++) {
            let k_x = stiffness * 3.0;
            let c_x = damping * 4.0;  

            if (currentState === 'RESPONDING') {
                k_x = 1.8;
                c_x = 2.5; 
            } else if (currentState === 'YIELDING') {
                k_x = 2.8;
                c_x = 4.2;
            }

            let dynamicTargetX = targetX;
            if (currentState === 'LISTENING') {
                dynamicTargetX += micVolume * 0.25;
            }

            let forceX = -k_x * (x - dynamicTargetX) - c_x * vX;
            vX += (forceX / mass) * dt;
            x += vX * dt;
            if (x < 0.15) {
                x = 0.15;
                vX = 0.0;
            }

            let k_f = stiffness * 3.5;
            let c_f = damping * 2.2;
            let forceFreq = -k_f * (currentFreq - targetFreq) - c_f * vFreq;
            vFreq += (forceFreq / mass) * dt;
            currentFreq += vFreq * dt;
            if (currentFreq < 0) currentFreq = 0;

            let targetColor = STATES[currentState].color;
            let targetR_norm = targetColor.r / 255.0;
            let targetG_norm = targetColor.g / 255.0;
            let targetB_norm = targetColor.b / 255.0;

            let k_r = stiffness, k_g = stiffness, k_b = stiffness;
            let c_r = damping,   c_g = damping,   c_b = damping;

            if (currentState === 'RESPONDING') {
                k_r = stiffness * 8.5;
                k_g = stiffness * 9.0;
                k_b = stiffness * 3.0;
                c_r = damping * 4.5;
                c_g = damping * 5.0;
                c_b = damping * 7.5;
            } else if (currentState === 'YIELDING') {
                k_r = stiffness * 2.5;
                k_g = stiffness * 2.0;
                k_b = stiffness * 4.0;
                c_r = damping * 3.0;
                c_g = damping * 2.8;
                c_b = damping * 3.5;
            } else if (currentState === 'EVALUATING') {
                let flutterMod = Math.sin(evalTime * 8.0) * 0.08 * (1.0 - progress);
                k_r = (stiffness * 2.0) + flutterMod;
                k_g = (stiffness * 1.8) - flutterMod;
                k_b = stiffness * 1.0;
                c_r = damping * 2.0;
                c_g = damping * 2.0;
                c_b = damping * 2.0;
            }

            let forceR = -k_r * (currentRGB_norm.r - targetR_norm) - c_r * vR;
            vR += (forceR / mass) * dt;
            currentRGB_norm.r += vR * dt;

            let forceG = -k_g * (currentRGB_norm.g - targetG_norm) - c_g * vG;
            vG += (forceG / mass) * dt;
            currentRGB_norm.g += vG * dt;

            let forceB = -k_b * (currentRGB_norm.b - targetB_norm) - c_b * vB;
            vB += (forceB / mass) * dt;
            currentRGB_norm.b += vB * dt;

            currentRGB_norm.r = Math.max(0, Math.min(1, currentRGB_norm.r));
            currentRGB_norm.g = Math.max(0, Math.min(1, currentRGB_norm.g));
            currentRGB_norm.b = Math.max(0, Math.min(1, currentRGB_norm.b));

            let j00 = 1.0 - (k_x * dt * dt) / mass;
            let j01 = dt * (1.0 - (c_x * dt) / mass) + dt;
            let j10 = -(k_x * dt) / mass;
            let j11 = 1.0 - (c_x * dt) / mass;

            let trace_J = j00 + j11;
            let det_J = (j00 * j11) - (j01 * j10);

            let discriminant = (trace_J * trace_J) - (4.0 * det_J);
            let rho_J = 0.0;

            if (discriminant >= 0) {
                let lambda1 = (trace_J + Math.sqrt(discriminant)) / 2.0;
                let lambda2 = (trace_J - Math.sqrt(discriminant)) / 2.0;
                rho_J = Math.max(Math.abs(lambda1), Math.abs(lambda2));
            } else {
                rho_J = Math.sqrt(det_J);
            }
            window.currentSpectralRadius = rho_J;
        }

        if (isNaN(x)) x = 1.0;
        if (isNaN(vX)) vX = 0.0;
        if (isNaN(currentFreq)) currentFreq = 0.5;
        if (isNaN(vFreq)) vFreq = 0.0;

        phase += 0.04 * currentFreq;
        if (phase > Math.PI * 2) {
            phase -= Math.PI * 2;
        }

        let targetBreathAmp = 0.0;
        if (currentState === 'EVALUATING') {
            targetBreathAmp = 0.15;
        } else if (currentState === 'YIELDING') {
            targetBreathAmp = 0.3 * Math.max(0, 1.0 - yieldingDuration);
        } else if (currentState === 'LISTENING') {
            targetBreathAmp = 0.05 + micVolume * 0.15;
        }
        
        let ampInterpRate = (currentState === 'EVALUATING') ? 0.08 : 0.15;
        currentBreathAmp += (targetBreathAmp - currentBreathAmp) * ampInterpRate;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        let breath = (1.0 - currentBreathAmp) + Math.sin(phase) * currentBreathAmp;
        const renderRadius = 75 * x * breath;
        
        const r = Math.round(currentRGB_norm.r * 255);
        const g = Math.round(currentRGB_norm.g * 255);
        const b = Math.round(currentRGB_norm.b * 255);
        const colorStr = `rgb(${r}, ${g}, ${b})`;

        ctx.shadowBlur = 40 * x * breath;
        ctx.shadowColor = colorStr;
        ctx.fillStyle = colorStr;
        
        ctx.beginPath();
        const NUM_VERTICES = 120;
        for (let i = 0; i < NUM_VERTICES; i++) {
            let angle = (i / NUM_VERTICES) * Math.PI * 2;
            
            let dynamicWave = 0;
            if (currentState === 'LISTENING' && micVolume > 0.02) {
                let wave1 = Math.sin(angle * 5 + phase * 2.5) * 12.0 * micVolume;
                let wave2 = Math.cos(angle * 3 - phase * 1.2) * 6.0 * micVolume;
                let wave3 = Math.sin(angle * 8 + phase * 4.0) * 3.0 * micVolume;
                dynamicWave = wave1 + wave2 + wave3;
            }
            
            let currentRadius = renderRadius + dynamicWave;
            let px = cx + Math.cos(angle) * currentRadius;
            let py = cy + Math.sin(angle) * currentRadius;
            
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.3)`;
        ctx.beginPath();
        for (let i = 0; i < NUM_VERTICES; i++) {
            let angle = (i / NUM_VERTICES) * Math.PI * 2;
            let dynamicWave = 0;
            if (currentState === 'LISTENING' && micVolume > 0.02) {
                dynamicWave = Math.sin(angle * 5 + phase * 2.5) * 15.0 * micVolume;
            }
            let currentRadius = (renderRadius * 1.12) + dynamicWave;
            let px = cx + Math.cos(angle) * currentRadius;
            let py = cy + Math.sin(angle) * currentRadius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        
        let noiseIntensity = 1.0;
        if (currentState === 'EVALUATING') {
            noiseIntensity = 1.0 + Math.pow(progress, 1.4) * 1.5;
        } else if (currentState === 'RESPONDING') {
            noiseIntensity = 0.4;
        } else if (currentState === 'YIELDING') {
            noiseIntensity = 2.5 * Math.max(0, 1.0 - x);
        } else if (currentState === 'LISTENING') {
            noiseIntensity = 1.0 + micVolume * 3.0;
        }

        let targetRotSpeed = 0.008;
        if (currentState === 'EVALUATING') {
            let baseRot = 0.035 + Math.pow(progress, 1.4) * 0.065;
            let sprintBoost = 0.0;
            if (progress > 0.82) {
                let sprintProgress = (progress - 0.82) / 0.18;
                sprintBoost = Math.pow(sprintProgress, 3.0) * 0.07;
            }
            targetRotSpeed = baseRot + sprintBoost;
        } else if (currentState === 'RESPONDING') {
            targetRotSpeed = 0.005;
        } else if (currentState === 'YIELDING') {
            targetRotSpeed = 0.04;
        }

        let rotInterpRate = (currentState === 'RESPONDING') ? 0.04 : 0.12;
        currentRotSpeed += (targetRotSpeed - currentRotSpeed) * rotInterpRate;

        let targetShrink = 0.0;
        if (currentState === 'EVALUATING') {
            targetShrink = Math.pow(progress, 1.4) * 0.32;
        } else if (currentState === 'YIELDING') {
            targetShrink = -0.35 * Math.max(0, 1.0 - yieldingDuration);
        } else if (currentState === 'LISTENING') {
            targetShrink = -micVolume * 0.15;
        }

        let shrinkInterpRate = (currentState === 'EVALUATING') ? 0.15 : 0.06;
        currentShrink += (targetShrink - currentShrink) * shrinkInterpRate;

        particles.forEach(p => {
            let thermalJitterAngle = Math.sin(Date.now() * 0.005 + p.distance) * 0.05 * noiseIntensity; 
            let thermalJitterDist = Math.cos(Date.now() * 0.003 + p.angle) * 3.5 * noiseIntensity; 

            p.angle += (currentRotSpeed * p.speedOffset) + thermalJitterAngle * 0.05;
            let currentDist = (p.distance + thermalJitterDist) * (1.0 - currentShrink);

            const px = cx + Math.cos(p.angle) * currentDist;
            const py = cy + Math.sin(p.angle) * currentDist;

            ctx.fillStyle = `rgba(255, 255, 255, ${currentState === 'RESPONDING' ? 0.35 : (currentState === 'EVALUATING' ? 0.8 : 0.65)})`;
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();
        });

        const dbgDamping = document.getElementById('dbgDamping');
        const dbgFreq = document.getElementById('dbgFreq');
        const dbgTimer = document.getElementById('dbgTimer');
        const dbgJacobian = document.getElementById('dbgJacobian'); 
        
        if (dbgDamping) dbgDamping.innerText = damping.toFixed(3);
        if (dbgFreq) dbgFreq.innerText = (currentState === 'RESPONDING' ? 0.0 : currentFreq).toFixed(2);
        
        if (dbgTimer) {
            if (currentState === 'EVALUATING') {
                let timeLeft = Math.max(0, evalMaxDuration - evalTime).toFixed(1);
                dbgTimer.innerText = `${timeLeft}s 后自动应答`;
                dbgTimer.style.color = "#ffbe00";
            } else if (currentState === 'YIELDING') {
                dbgTimer.innerText = "💥 抢词爆发让步";
                dbgTimer.style.color = "#66fcf1";
            } else if (currentState === 'LISTENING' && analyser) {
                if (micVolume > SILENCE_THRESHOLD) {
                    dbgTimer.innerText = `🎙️ 正在说话: ${(micVolume * 100).toFixed(0)}%`;
                    dbgTimer.style.color = "var(--primary-color)";
                } else {
                    let vState = ((0.65 - silenceDuration)).toFixed(2);
                    dbgTimer.innerText = `⏳ 停顿静默判定: ${vState}s`;
                    dbgTimer.style.color = "#8892b0";
                }
            } else {
                dbgTimer.innerText = "就绪";
                dbgTimer.style.color = "#8892b0";
            }
        }

        if (dbgJacobian && window.currentSpectralRadius !== undefined) {
            dbgJacobian.innerText = window.currentSpectralRadius.toFixed(4);
            if (window.currentSpectralRadius > 1.0) {
                dbgJacobian.style.color = "#ff4d4d"; 
            } else {
                dbgJacobian.style.color = "#66fcf1"; 
            }
        }

        requestAnimationFrame(physicsLoop);
    }

    physicsLoop();
</script>
